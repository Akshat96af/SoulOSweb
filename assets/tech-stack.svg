<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514 30" width="514" height="30" fill="none">
  <style>
    .pill-bg { fill: #1c221a; stroke: #2f392c; stroke-width: 1; rx: 15; }
    .pill-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif; font-size: 11.5px; font-weight: 500; fill: #d0d8cc; letter-spacing: 0.2px; }
    .pill-icon { fill: none; stroke: #8ca384; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- React 19 -->
  <g transform="translate(0, 0)">
    <rect x="0.5" y="0.5" width="94" height="29" class="pill-bg"/>
    <!-- React Atom Icon -->
    <ellipse cx="20" cy="15" rx="7" ry="2.8" stroke="#8ca384" stroke-width="1.2" transform="rotate(30 20 15)"/>
    <ellipse cx="20" cy="15" rx="7" ry="2.8" stroke="#8ca384" stroke-width="1.2" transform="rotate(90 20 15)"/>
    <ellipse cx="20" cy="15" rx="7" ry="2.8" stroke="#8ca384" stroke-width="1.2" transform="rotate(150 20 15)"/>
    <circle cx="20" cy="15" r="1.2" fill="#8ca384"/>
    <text x="34" y="18.5" class="pill-txt">React 19</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(102, 0)">
    <rect x="0.5" y="0.5" width="106" height="29" class="pill-bg"/>
    <!-- TypeScript Badge Icon -->
    <rect x="13" y="8" width="14" height="14" rx="2" fill="#293326" stroke="#8ca384" stroke-width="1"/>
    <text x="16" y="18.5" font-family="-apple-system, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#8ca384">TS</text>
    <text x="34" y="18.5" class="pill-txt">TypeScript</text>
  </g>

  <!-- Vite -->
  <g transform="translate(216, 0)">
    <rect x="0.5" y="0.5" width="76" height="29" class="pill-bg"/>
    <!-- Vite V Icon -->
    <path d="M15 9l4.5 12 4.5-12" class="pill-icon"/>
    <path d="M19.5 9v12" stroke="#8ca384" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <text x="32" y="18.5" class="pill-txt">Vite 6</text>
  </g>

  <!-- Motion -->
  <g transform="translate(300, 0)">
    <rect x="0.5" y="0.5" width="92" height="29" class="pill-bg"/>
    <!-- Motion / Framer Icon -->
    <path d="M15 8h10l-10 7h10v7l-5-4-5 4V8z" fill="#2d3829" stroke="#8ca384" stroke-width="1" stroke-linejoin="round"/>
    <text x="34" y="18.5" class="pill-txt">Motion</text>
  </g>

  <!-- Zustand -->
  <g transform="translate(400, 0)">
    <rect x="0.5" y="0.5" width="98" height="29" class="pill-bg"/>
    <!-- Zustand Store Icon -->
    <circle cx="20" cy="15" r="5.5" stroke="#8ca384" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="2" fill="#8ca384"/>
    <path d="M17 11.5a6 6 0 016 0" stroke="#8ca384" stroke-width="1.2" stroke-linecap="round"/>
    <text x="33" y="18.5" class="pill-txt">Zustand 5</text>
  </g>
</svg>
