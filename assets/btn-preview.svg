<svg xmlns="http://www.w3.org/2000/svg" width="300" height="54" viewBox="0 0 300 54" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Launch Live Desktop button</title>

  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="298" height="52" rx="6" ry="6"/></clipPath>

    <!-- anodized titanium-green body -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#181f15"/>
      <stop offset="45%"  stop-color="#10150d"/>
      <stop offset="100%" stop-color="#07090a"/>
    </linearGradient>

    <!-- machined gradient bezel -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#92ad89" stop-opacity="0.55"/>
      <stop offset="38%"  stop-color="#3a4936" stop-opacity="0.18"/>
      <stop offset="62%"  stop-color="#3a4936" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8da885" stop-opacity="0.55"/>
    </linearGradient>

    <!-- top rim highlight -->
    <linearGradient id="rim-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c4ddbf" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#c4ddbf" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#c4ddbf" stop-opacity="0.4"/>
      <stop offset="85%"  stop-color="#c4ddbf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c4ddbf" stop-opacity="0"/>
    </linearGradient>

    <!-- bottom depth line -->
    <linearGradient id="rim-btm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#000" stop-opacity="0.4"/>
      <stop offset="70%"  stop-color="#000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <!-- inner glass-panel highlight -->
    <linearGradient id="inner-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c4ddbf" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c4ddbf" stop-opacity="0"/>
    </linearGradient>

    <!-- specular sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#e2f0df" stop-opacity="0.4"/>
      <stop offset="48%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="52%"  stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="65%"  stop-color="#e2f0df" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="bracket-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glyph-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur result="blur">
        <animate attributeName="stdDeviation" values="1.6;3.2;1.6" dur="8s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sheen-pass{ animation: glide 8s cubic-bezier(.4,0,.15,1) infinite; }
    @keyframes glide{
      0%   { transform: translateX(-40px) skewX(-16deg); opacity: 0; }
      6%   { opacity: 1; }
      30%  { opacity: 1; }
      38%  { transform: translateX(360px) skewX(-16deg); opacity: 0; }
      100% { transform: translateX(-40px) skewX(-16deg); opacity: 0; }
    }
    .bracket-pulse{ animation: bpulse 8s ease-in-out infinite; }
    @keyframes bpulse{
      0%, 100% { opacity: 0.55; }
      45%      { opacity: 1; }
      60%      { opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce){
      .sheen-pass, .bracket-pulse{ animation: none !important; }
    }
  </style>

  <!-- body -->
  <rect x="1" y="1" width="298" height="52" rx="6" fill="url(#body)" stroke="url(#edge)" stroke-width="1"/>
  <rect x="2" y="2" width="296" height="22" rx="5" fill="url(#inner-glow)"/>
  <line x1="10" y1="1.5" x2="290" y2="1.5" stroke="url(#rim-top)" stroke-width="0.8"/>
  <line x1="10" y1="52.5" x2="290" y2="52.5" stroke="url(#rim-btm)" stroke-width="0.8"/>

  <!-- sheen sweep -->
  <g clip-path="url(#frame)">
    <rect class="sheen-pass" x="0" y="-8" width="16" height="70" fill="url(#sheen)"/>
  </g>

  <!-- corner brackets -->
  <g filter="url(#bracket-glow)" class="bracket-pulse">
    <path d="M1 10V1h9"     stroke="#8faa86" stroke-width="1.6" stroke-linecap="square" fill="none"/>
    <path d="M299 10V1h-9"  stroke="#8faa86" stroke-width="1.6" stroke-linecap="square" fill="none"/>
    <path d="M1 44v9h9"     stroke="#8faa86" stroke-width="1.6" stroke-linecap="square" fill="none"/>
    <path d="M299 44v9h-9"  stroke="#8faa86" stroke-width="1.6" stroke-linecap="square" fill="none"/>
  </g>

  <!-- glyph -->
  <g transform="translate(26,18)" filter="url(#glyph-glow)" stroke="#8faa86" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M4.5 0c5.5 0 1 17 6.5 17"/>
    <path d="M0 3.5c5.5 0 1 12.5 6.5 12.5"/>
    <path d="M9 0.5c5.5 0 1 12.5 6.5 12.5"/>
  </g>

  <!-- label -->
  <text x="56" y="32.5" fill="#eef2ec" font-family="'SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif" font-size="12.6" font-weight="600" letter-spacing="1.9">LAUNCH LIVE DESKTOP</text>

  <!-- arrow -->
  <g transform="translate(266,19)" stroke="#8faa86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 11L9 2"/>
    <path d="M3 2H9V8"/>
  </g>
</svg>
