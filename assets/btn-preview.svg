<svg xmlns="http://www.w3.org/2000/svg" width="240" height="44" viewBox="0 0 240 44" fill="none">
  <defs>
    <!-- button boundary clip -->
    <clipPath id="btn-clip">
      <rect x="1" y="1" width="238" height="42"/>
    </clipPath>

    <!-- tactical matte background -->
    <linearGradient id="btn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182017"/>
      <stop offset="100%" stop-color="#0b100a"/>
    </linearGradient>

    <!-- precision border -->
    <linearGradient id="btn-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8faa86" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#2d372a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8faa86" stop-opacity="0.45"/>
    </linearGradient>

    <!-- top micro-rim chamfer -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#8faa86" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- AE motion laser: razor specular core slit -->
    <linearGradient id="laser-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8faa86" stop-opacity="0"/>
      <stop offset="25%" stop-color="#9fc298" stop-opacity="0.12"/>
      <stop offset="44%" stop-color="#cde8c7" stop-opacity="0.6"/>
      <stop offset="48.5%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="51.5%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="56%" stop-color="#cde8c7" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#9fc298" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8faa86" stop-opacity="0"/>
    </linearGradient>

    <!-- AE motion laser: trailing ghost hairline echo -->
    <linearGradient id="laser-echo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8faa86" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c2e3bd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8faa86" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ae-streak {
      animation: laserSweep 4.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    @keyframes laserSweep {
      0% {
        transform: translateX(-100px) skewX(-28deg);
        opacity: 0;
      }
      2.5% {
        opacity: 1;
      }
      26% {
        opacity: 1;
      }
      31% {
        transform: translateX(290px) skewX(-28deg);
        opacity: 0;
      }
      32% {
        transform: translateX(-100px) skewX(-28deg);
        opacity: 0;
      }
      100% {
        transform: translateX(-100px) skewX(-28deg);
        opacity: 0;
      }
    }
  </style>

  <!-- base background -->
  <rect x="1" y="1" width="238" height="42" fill="url(#btn-bg)" stroke="url(#btn-edge)" stroke-width="1"/>

  <!-- top edge rim highlight -->
  <line x1="2" y1="1.5" x2="238" y2="1.5" stroke="url(#rim)" stroke-width="1"/>

  <!-- After Effects style dual-streak optical pass -->
  <g clip-path="url(#btn-clip)">
    <g class="ae-streak">
      <!-- trailing secondary hairline echo (8px behind) -->
      <rect x="0" y="-8" width="4" height="60" fill="url(#laser-echo)"/>
      <!-- primary razor laser slit (sharp 26px profile) -->
      <rect x="12" y="-8" width="26" height="60" fill="url(#laser-core)"/>
    </g>
  </g>

  <!-- corner brackets -->
  <path d="M1 8V1h7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M239 8V1h-7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M1 36v7h7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M239 36v7h-7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>

  <!-- soul glyph icon -->
  <g transform="translate(22,14)" stroke="#8faa86" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M4 0c5 0 1 15 6 15"/>
    <path d="M0 3c5 0 1 11 6 11"/>
    <path d="M8 0c5 0 1 11 6 11"/>
  </g>

  <!-- typography -->
  <text x="50" y="26.5" fill="#f0f3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">LAUNCH LIVE DESKTOP</text>

  <!-- terminal arrow -->
  <path d="M209 25l5.5-5.5m0 0h-4.5m4.5 0v4.5" stroke="#8faa86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
