<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 46" width="240" height="46" fill="none">
  <defs>
    <!-- Soft ambient shadow -->
    <filter id="btnShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Obsidian glass gradient -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d241b"/>
      <stop offset="100%" stop-color="#0e130d"/>
    </linearGradient>

    <!-- Hairline luxury border -->
    <linearGradient id="hairline" x1="0" y1="0" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Subtle animated light shimmer across the surface -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07">
        <animate attributeName="offset" values="-0.3; 1.3" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Button Body -->
  <rect x="2" y="2" width="236" height="42" rx="21" fill="url(#glassFill)" filter="url(#btnShadow)"/>
  <rect x="2" y="2" width="236" height="42" rx="21" fill="url(#sheen)"/>
  <rect x="2" y="2" width="236" height="42" rx="21" stroke="url(#hairline)" stroke-width="1"/>

  <!-- Left: Soul Wave Glyph -->
  <g transform="translate(24, 15)" stroke="#9db895" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M4 1c4 0 1 14 5 14"/>
    <path d="M0 4c4 0 1 10 5 10"/>
    <path d="M8 1c4 0 1 10 5 10"/>
  </g>

  <!-- Center Text -->
  <text x="52" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="13.5" font-weight="600" letter-spacing="-0.2px">
    Launch Live Desktop
  </text>

  <!-- Right: Arrow ↗ -->
  <g transform="translate(198, 17)" stroke="#9db895" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 9L8 2M8 2H3.5M8 2V6.5"/>
  </g>
</svg>
