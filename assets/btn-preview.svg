<button class="launch-btn" id="launchBtn" type="button">
  <i class="bracket tl"></i><i class="bracket tr"></i>
  <i class="bracket bl"></i><i class="bracket br"></i>
  <span class="face">
    <span class="sheen"></span>
    <svg class="glyph" viewBox="0 0 20 16" fill="none">
      <path d="M4 1c5 0 1 14 6 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M.5 3.5c5 0 1 9 6 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M8 1.5c5 0 1 9 6 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span class="label">Launch Live Desktop</span>
    <span class="icon-stack">
      <svg class="icon-arrow" viewBox="0 0 12 12"><path d="M2 10 10 2M4 2h6v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="spinner"></span>
      <svg class="icon-check" viewBox="0 0 12 12"><path d="M2 6.5 5 9.5 10 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </span>
</button>

/* core rules — hover, focus and reduced-motion states live in the full source */
.launch-btn{
  padding:1px; border:none; border-radius:7px; cursor:pointer;
  background:linear-gradient(135deg,rgba(146,173,137,.55),rgba(58,73,54,.18) 38%,rgba(58,73,54,.18) 62%,rgba(146,173,137,.55));
  box-shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 28px -14px rgba(0,0,0,.65);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
}
.launch-btn:hover{ transform:translateY(-2px); }
.launch-btn:active{ transform:translateY(0) scale(.975); }
.face{
  height:3.35rem; padding:0 1.35em 0 1.05em; border-radius:6px; display:inline-flex; align-items:center; gap:.7em; overflow:hidden;
  background:linear-gradient(180deg,#181f15,#10150d 45%,#07090a);
  box-shadow:inset 0 1px 0 rgba(196,221,191,.4), inset 0 -1px 0 rgba(0,0,0,.4);
}
.bracket{ position:absolute; width:8px; height:8px; border:1.4px solid #8faa86; filter:drop-shadow(0 0 3px rgba(143,170,134,.35)); }
.sheen{
  position:absolute; width:20%; height:160%; top:-30%; left:-12%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85) 50%,transparent);
  animation:sheenSweep 8s cubic-bezier(.4,0,.15,1) infinite;
}
@keyframes sheenSweep{
  0%{ transform:translateX(-180%) skewX(-16deg); opacity:0; }
  6%,30%{ opacity:1; }
  38%,100%{ transform:translateX(620%) skewX(-16deg); opacity:0; }
}
