<!-- Launch Live Desktop — button component only -->
<!-- Self-contained: no external dependencies, no page-level styles required. -->

<button class="launch-btn" id="launchBtn" type="button">
  <i class="bracket tl"></i><i class="bracket tr"></i>
  <i class="bracket bl"></i><i class="bracket br"></i>
  <span class="face">
    <span class="sheen"></span>
    <svg class="glyph" viewBox="0 0 20 16" fill="none" aria-hidden="true">
      <path d="M4 1c5 0 1 14 6 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M.5 3.5c5 0 1 9 6 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M8 1.5c5 0 1 9 6 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span class="label" id="launchLabel" aria-live="polite">Launch Live Desktop</span>
    <span class="icon-stack">
      <svg class="icon-arrow" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2 10 10 2M4 2h6v6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="spinner" aria-hidden="true"></span>
      <svg class="icon-check" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2 6.5 5 9.5 10 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </span>
</button>

<style>
  .launch-btn{
    --r:7px;
    --metal-1:#181f15;
    --metal-2:#10150d;
    --metal-3:#07090a;
    --edge-a:rgba(146,173,137,.55);
    --edge-b:rgba(58,73,54,.18);
    --rim-top:rgba(196,221,191,.4);
    --rim-btm:rgba(0,0,0,.4);
    --sage:#8faa86;
    --sage-bright:#cfe7c9;
    --glow-soft:rgba(143,170,134,.35);
    --glow-strong:rgba(196,221,191,.6);
    --btn-ink:#eef2ec;

    position:relative;
    display:inline-flex;
    padding:1px;
    border:none;
    border-radius:var(--r);
    background:linear-gradient(135deg, var(--edge-a), var(--edge-b) 38%, var(--edge-b) 62%, var(--edge-a));
    cursor:pointer;
    isolation:isolate;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 28px -14px rgba(0,0,0,.65);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  }
  .launch-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 1px 1px rgba(0,0,0,.5), 0 18px 38px -16px rgba(0,0,0,.7), 0 0 26px -4px var(--glow-soft);
  }
  .launch-btn:active{ transform:translateY(0) scale(.975); }
  .launch-btn:focus-visible{ outline:2px solid var(--sage-bright); outline-offset:3px; }
  .launch-btn:focus:not(:focus-visible){ outline:none; }

  .bracket{
    display:block;
    position:absolute;
    width:8px; height:8px;
    border:1.4px solid var(--sage);
    opacity:.6;
    filter:drop-shadow(0 0 3px var(--glow-soft));
    animation:bracketPulse 8s ease-in-out infinite;
  }
  .tl{ top:2px; left:2px; border-right:none; border-bottom:none; }
  .tr{ top:2px; right:2px; border-left:none; border-bottom:none; }
  .bl{ bottom:2px; left:2px; border-right:none; border-top:none; }
  .br{ bottom:2px; right:2px; border-left:none; border-top:none; }
  .launch-btn:hover .bracket, .launch-btn.is-loading .bracket, .launch-btn.is-live .bracket{
    opacity:1; filter:drop-shadow(0 0 5px var(--glow-strong));
  }
  @keyframes bracketPulse{
    0%,100%{ opacity:.55; }
    45%{ opacity:1; }
    60%{ opacity:.55; }
  }

  .face{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:.7em;
    height:3.35rem;
    padding:0 1.35em 0 1.05em;
    border-radius:calc(var(--r) - 1px);
    background:linear-gradient(180deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
    overflow:hidden;
    box-shadow:
      inset 0 1px 0 var(--rim-top),
      inset 0 -1px 0 var(--rim-btm),
      inset 0 16px 24px -20px rgba(196,221,191,.14);
  }

  .sheen{
    position:absolute;
    top:-30%; left:-12%;
    width:20%; height:160%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0) 18%, rgba(255,255,255,.85) 50%, rgba(255,255,255,0) 82%, transparent);
    transform:translateX(-180%) skewX(-16deg);
    animation:sheenSweep 8s cubic-bezier(.4,0,.15,1) infinite;
    pointer-events:none;
  }
  @keyframes sheenSweep{
    0%{ transform:translateX(-180%) skewX(-16deg); opacity:0; }
    6%{ opacity:1; }
    30%{ opacity:1; }
    38%{ transform:translateX(620%) skewX(-16deg); opacity:0; }
    100%{ transform:translateX(-180%) skewX(-16deg); opacity:0; }
  }

  .glyph{
    width:17px; height:15px; flex:0 0 auto;
    color:var(--sage);
    filter:drop-shadow(0 0 4px var(--glow-soft));
    animation:glyphBreathe 8s ease-in-out infinite;
  }
  @keyframes glyphBreathe{
    0%,100%{ filter:drop-shadow(0 0 3px var(--glow-soft)); }
    45%{ filter:drop-shadow(0 0 6px var(--glow-strong)); }
    60%{ filter:drop-shadow(0 0 3px var(--glow-soft)); }
  }

  .label{
    font:600 .76rem/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--btn-ink);
    white-space:nowrap;
  }

  .icon-stack{ position:relative; width:13px; height:13px; flex:0 0 auto; }
  .icon-stack svg{ position:absolute; inset:0; color:var(--sage); transition:opacity .25s ease, transform .25s ease; }
  .icon-arrow{ opacity:1; }
  .launch-btn:hover .icon-arrow{ transform:translate(2px,-2px); }
  .icon-check{ opacity:0; }
  .spinner{
    position:absolute; inset:1.5px;
    border:1.6px solid rgba(143,170,134,.3);
    border-top-color:var(--sage);
    border-radius:50%;
    opacity:0;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .launch-btn.is-loading .icon-arrow{ opacity:0; }
  .launch-btn.is-loading .spinner{ opacity:1; }
  .launch-btn.is-live .spinner{ opacity:0; }
  .launch-btn.is-live .icon-check{ opacity:1; }

  @media (prefers-reduced-motion:reduce){
    .sheen, .bracket, .glyph{ animation:none !important; }
    .launch-btn:hover{ transform:none; }
  }
</style>

<script>
(function(){
  var btn = document.getElementById('launchBtn');
  var label = document.getElementById('launchLabel');
  var busy = false;
  var IDLE = 'Launch Live Desktop';

  btn.addEventListener('click', function(){
    if (busy) return;
    busy = true;
    btn.classList.add('is-loading');
    btn.setAttribute('aria-disabled', 'true');
    label.textContent = 'Launching…';
    setTimeout(function(){
      btn.classList.remove('is-loading');
      btn.classList.add('is-live');
      label.textContent = 'Live';
      setTimeout(function(){
        btn.classList.remove('is-live');
        btn.removeAttribute('aria-disabled');
        label.textContent = IDLE;
        busy = false;
      }, 1500);
    }, 1300);
  });
})();
</script>
