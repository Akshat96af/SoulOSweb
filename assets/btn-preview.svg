<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" width="240" height="44" fill="none">
  <defs>
    <linearGradient id="rectFill" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182016"/>
      <stop offset="100%" stop-color="#0b100a"/>
    </linearGradient>
    <linearGradient id="rectBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba683"/>
      <stop offset="50%" stop-color="#3b4837"/>
      <stop offset="100%" stop-color="#1f261d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08">
        <animate attributeName="offset" values="-0.3; 1.3" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sharp Rectangle Base -->
  <rect x="1" y="1" width="238" height="42" fill="url(#rectFill)" stroke="url(#rectBorder)" stroke-width="1.2"/>
  <rect x="1" y="1" width="238" height="42" fill="url(#sheen)"/>

  <!-- Precision Corner Brackets -->
  <path d="M1 9V1H9" stroke="#9bb892" stroke-width="1.8"/>
  <path d="M239 9V1H231" stroke="#9bb892" stroke-width="1.8"/>
  <path d="M1 35V43H9" stroke="#9bb892" stroke-width="1.8"/>
  <path d="M239 35V43H231" stroke="#9bb892" stroke-width="1.8"/>

  <!-- Left: Soul Wave Glyph -->
  <g transform="translate(24, 14)" stroke="#9bb892" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M4 1c4 0 1 14 5 14"/>
    <path d="M0 4c4 0 1 10 5 10"/>
    <path d="M8 1c4 0 1 10 5 10"/>
  </g>

  <!-- Center Text -->
  <text x="52" y="26" fill="#f4f7f2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2px">
    LAUNCH LIVE DESKTOP
  </text>

  <!-- Right: Arrow ↗ -->
  <g transform="translate(202, 16)" stroke="#9bb892" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 8L7 2M7 2H2.5M7 2V6.5"/>
  </g>
</svg>
