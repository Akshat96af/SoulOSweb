<svg xmlns="http://www.w3.org/2000/svg" width="240" height="44" viewBox="0 0 240 44" fill="none">
  <defs>
    <!-- button shape clip -->
    <clipPath id="btn-clip">
      <rect x="1" y="1" width="238" height="42"/>
    </clipPath>

    <!-- dark tactical background -->
    <linearGradient id="btn-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182017"/>
      <stop offset="100%" stop-color="#0b100a"/>
    </linearGradient>

    <!-- perimeter border -->
    <linearGradient id="btn-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8faa86" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3b4838" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8faa86" stop-opacity="0.45"/>
    </linearGradient>

    <!-- luxury specular sheen ray -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#9fc298" stop-opacity="0.06"/>
      <stop offset="44%" stop-color="#d4ecd0" stop-opacity="0.32"/>
      <stop offset="49%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="51%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="56%" stop-color="#d4ecd0" stop-opacity="0.32"/>
      <stop offset="72%" stop-color="#9fc298" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- subtle top rim light -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="20%" stop-color="#8faa86" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#8faa86" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    .sheen {
      animation: sweep 4.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    @keyframes sweep {
      0% {
        transform: translateX(-150px) skewX(-24deg);
        opacity: 0;
      }
      4% {
        opacity: 0.95;
      }
      30% {
        opacity: 0.95;
      }
      36% {
        transform: translateX(310px) skewX(-24deg);
        opacity: 0;
      }
      37% {
        transform: translateX(-150px) skewX(-24deg);
        opacity: 0;
      }
      100% {
        transform: translateX(-150px) skewX(-24deg);
        opacity: 0;
      }
    }
  </style>

  <!-- base background -->
  <rect x="1" y="1" width="238" height="42" fill="url(#btn-bg)" stroke="url(#btn-edge)" stroke-width="1"/>

  <!-- top rim highlight -->
  <line x1="2" y1="1.5" x2="238" y2="1.5" stroke="url(#rim)" stroke-width="1"/>

  <!-- dynamic light sweep -->
  <g clip-path="url(#btn-clip)">
    <rect class="sheen" x="0" y="-8" width="96" height="58" fill="url(#beam)"/>
  </g>

  <!-- corner brackets -->
  <path d="M1 8V1h7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M239 8V1h-7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M1 36v7h7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M239 36v7h-7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>

  <!-- soul glyph icon -->
  <g transform="translate(22,14)" stroke="#8faa86" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M4 0c5 0 1 15 6 15"/>
    <path d="M0 3c5 0 1 11 6 11"/>
    <path d="M8 0c5 0 1 11 6 11"/>
  </g>

  <!-- typography -->
  <text x="50" y="26.5" fill="#f0f3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">LAUNCH LIVE DESKTOP</text>

  <!-- terminal arrow centered -->
  <path d="M209 25l5.5-5.5m0 0h-4.5m4.5 0v4.5" stroke="#8faa86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
