<svg xmlns="http://www.w3.org/2000/svg" width="240" height="44" viewBox="0 0 240 44" fill="none">
  <defs>
    <clipPath id="c"><rect x="1" y="1" width="238" height="42"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2118"/>
      <stop offset="1" stop-color="#0d120c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a9472" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2a3228" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <style>
    .sweep { animation: s 5s linear infinite; }
    @keyframes s {
      0%   { opacity:0; transform: translateX(-120px) skewX(-25deg); }
      15%  { opacity:1; }
      50%  { opacity:1; }
      65%  { opacity:0; transform: translateX(340px) skewX(-25deg); }
      100% { opacity:0; transform: translateX(340px) skewX(-25deg); }
    }
  </style>

  <!-- body -->
  <rect x="1" y="1" width="238" height="42" fill="url(#bg)" stroke="url(#edge)" stroke-width=".8"/>

  <!-- light sweep -->
  <g clip-path="url(#c)">
    <rect x="0" y="-4" width="60" height="52" rx="2" fill="white" opacity="0" class="sweep" style="mix-blend-mode:soft-light"/>
  </g>

  <!-- corner ticks -->
  <path d="M1 8V1h7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M239 8V1h-7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M1 36v7h7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M239 36v7h-7" stroke="#8faa86" stroke-width="1.5" stroke-linecap="square"/>

  <!-- soul glyph -->
  <g transform="translate(22,14)" stroke="#8faa86" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M4 0c5 0 1 15 6 15"/><path d="M0 3c5 0 1 11 6 11"/><path d="M8 0c5 0 1 11 6 11"/>
  </g>

  <!-- label -->
  <text x="50" y="26.5" fill="#eef1ec" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">LAUNCH LIVE DESKTOP</text>

  <!-- arrow -->
  <path d="M210 16l6-6m0 0h-5m5 0v5" stroke="#8faa86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
